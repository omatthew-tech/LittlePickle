services:
  - type: web
    name: littlepickle-match-flow
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SMTP2GO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: support@joinlittlepickle.com
      - key: EMAIL_SENDER_NAME
        value: LittlePickle
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
