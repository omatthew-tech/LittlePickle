<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Friendly LittlePickle pickleball smile app icon</title>
  <desc id="desc">A compact warm white smiley face on a royal blue field, with two green pickleballs for eyes and seven smaller pickleballs forming an open smile.</desc>

  <defs>
    <g id="friendly-eye-ball">
      <circle r="82" fill="#CBDDA4"/>
      <g fill="#4B63C6">
        <ellipse cx="-20" cy="-43" rx="11" ry="8" transform="rotate(-12 -20 -43)"/>
        <ellipse cx="35" cy="-29" rx="9" ry="12" transform="rotate(-34 35 -29)"/>
        <ellipse cx="44" cy="22" rx="9" ry="12" transform="rotate(24 44 22)"/>
        <ellipse cx="10" cy="47" rx="12" ry="8" transform="rotate(5 10 47)"/>
        <ellipse cx="-39" cy="28" rx="9" ry="12" transform="rotate(-24 -39 28)"/>
        <ellipse cx="-46" cy="-18" rx="9" ry="12" transform="rotate(24 -46 -18)"/>
      </g>
    </g>

    <g id="friendly-smile-ball">
      <circle r="28" fill="#CBDDA4"/>
      <g fill="#4B63C6">
        <ellipse cx="-8" cy="-15" rx="5.5" ry="3.5" transform="rotate(-12 -8 -15)"/>
        <ellipse cx="14" cy="-8" rx="3.5" ry="5.5" transform="rotate(-28 14 -8)"/>
        <ellipse cx="13" cy="12" rx="3.5" ry="5.5" transform="rotate(28 13 12)"/>
        <ellipse cx="-5" cy="16" rx="5.5" ry="3.5" transform="rotate(8 -5 16)"/>
        <ellipse cx="-17" cy="3" rx="3.5" ry="5.5" transform="rotate(18 -17 3)"/>
      </g>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="#4B63C6"/>
  <circle cx="512" cy="512" r="365" fill="#F6F2E8"/>

  <use href="#friendly-eye-ball" transform="translate(392 402) rotate(-7)"/>
  <use href="#friendly-eye-ball" transform="translate(634 397) rotate(9) scale(-0.96 0.96)"/>

  <use href="#friendly-smile-ball" transform="translate(320 590) rotate(-20)"/>
  <use href="#friendly-smile-ball" transform="translate(384 625) rotate(-13)"/>
  <use href="#friendly-smile-ball" transform="translate(448 646) rotate(-7)"/>
  <use href="#friendly-smile-ball" transform="translate(512 653)"/>
  <use href="#friendly-smile-ball" transform="translate(576 646) rotate(7)"/>
  <use href="#friendly-smile-ball" transform="translate(640 625) rotate(13)"/>
  <use href="#friendly-smile-ball" transform="translate(704 590) rotate(20)"/>
</svg>
