<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">LittlePickle home screen spacing mockups</title>
  <desc id="desc">Three high fidelity home screen spacing options comparing 24, 28, and 32 dp between the league search field and the Your leagues heading.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#22283A" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#22283A" flood-opacity="0.18"/>
    </filter>
    <style>
      .canvas { fill: #F6F2E8; }
      .ink { fill: #22283A; }
      .secondary { fill: #686D7A; }
      .blue { fill: #4B63C6; }
      .match-point { fill: #3D50A8; }
      .card { fill: #FFFDF8; stroke: #D8D5CD; stroke-width: 1.2; }
      .control { fill: #FFFDF8; stroke: #D8D5CD; stroke-width: 1.2; }
      .divider { stroke: #D8D5CD; stroke-width: 1; }
      .ruler { stroke: #4B63C6; stroke-width: 1.5; stroke-linecap: round; }
      .rulerText { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #3D50A8; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; }
      .meta { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #686D7A; }
      .label { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #22283A; }
      .screenTitle { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #22283A; letter-spacing: 0; }
      .sectionTitle { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #22283A; letter-spacing: 0; }
      .body { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #22283A; }
      .button { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #4B63C6; }
      .cta { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #22283A; }
      .ctaButton { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #4B63C6; }
      .nav { font: 700 11px "Segoe UI", Arial, sans-serif; }
      .caption { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #686D7A; }
      .mockTitle { font: 700 21px "Segoe UI", Arial, sans-serif; fill: #22283A; }
      .badge { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #3D50A8; }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#ECE8DE"/>
  <rect x="42" y="34" width="1416" height="86" rx="22" fill="#FFFDF8" stroke="#D8D5CD"/>
  <text x="72" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#22283A">LittlePickle Home Spacing Mockups</text>
  <text x="72" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#686D7A">Goal: give "Your leagues" room to breathe after the search field without making the Home screen feel loose.</text>
  <rect x="1092" y="58" width="252" height="34" rx="17" fill="#E8ECFA"/>
  <text x="1112" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3D50A8">Recommended implementation: 28 dp</text>

  <!-- Option A -->
  <g transform="translate(80 165)">
    <text class="mockTitle" x="0" y="-28">Option A - Compact</text>
    <text class="caption" x="0" y="-6">24 dp search-to-heading gap</text>
    <rect x="0" y="0" width="360" height="780" rx="42" fill="#111827" filter="url(#phoneShadow)"/>
    <rect x="13" y="13" width="334" height="754" rx="31" class="canvas"/>
    <rect x="146" y="26" width="70" height="5" rx="3" fill="#22283A" opacity="0.9"/>
    <circle cx="271" cy="32" r="12" fill="#111827"/>
    <text x="34" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#22283A">2:29</text>
    <text class="screenTitle" x="34" y="117">LittlePickle</text>

    <rect x="34" y="155" width="292" height="150" rx="14" class="card"/>
    <g transform="translate(160 188)" stroke="#4B63C6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 15V0h15M45 0h15v15M60 45v15H45M15 60H0V45"/>
      <rect x="22" y="20" width="7" height="7" rx="1"/>
      <rect x="35" y="20" width="7" height="7" rx="1"/>
      <rect x="22" y="34" width="7" height="7" rx="1"/>
      <path d="M36 36h8v8h-8zM31 48h4M47 32h5M15 33h4"/>
    </g>
    <text x="180" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#4B63C6">Scan league QR</text>

    <line x1="34" y1="331" x2="143" y2="331" class="divider"/>
    <text x="180" y="336" text-anchor="middle" class="meta">or</text>
    <line x1="216" y1="331" x2="326" y2="331" class="divider"/>

    <rect x="34" y="358" width="292" height="52" rx="14" class="control"/>
    <g transform="translate(54 374)" stroke="#686D7A" stroke-width="2.25" fill="none" stroke-linecap="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="M13 13l7 7"/>
    </g>
    <text x="82" y="391" class="body" fill="#686D7A">Search for a league</text>

    <line x1="304" y1="410" x2="304" y2="434" class="ruler"/>
    <path d="M298 410h12M298 434h12" class="ruler"/>
    <text x="314" y="426" class="rulerText">24</text>

    <text x="34" y="458" class="sectionTitle">Your leagues</text>
    <rect x="34" y="474" width="292" height="118" rx="16" class="card" filter="url(#cardShadow)"/>
    <text x="51" y="511" class="label">Glennville Pickleball</text>
    <text x="51" y="534" class="label">Association</text>
    <text x="51" y="561" class="meta">2 courts | 30427 | 7 players, 0</text>
    <text x="51" y="582" class="meta">matches</text>
    <text x="254" y="541" class="button" text-anchor="middle">Enter queue</text>

    <text x="82" y="694" class="cta">Looking to start a league?</text>
    <text x="252" y="694" class="ctaButton" text-decoration="underline">Create league</text>
    <rect x="13" y="706" width="334" height="61" fill="#FFFDF8"/>
    <line x1="13" y1="706" x2="347" y2="706" class="divider"/>
    <rect x="75" y="716" width="52" height="44" rx="14" fill="none" stroke="#4B63C6" stroke-width="1.8"/>
    <text x="101" y="744" text-anchor="middle" class="nav" fill="#4B63C6">Home</text>
    <text x="181" y="744" text-anchor="middle" class="nav" fill="#686D7A">Play</text>
    <text x="260" y="744" text-anchor="middle" class="nav" fill="#686D7A">Profile</text>
  </g>

  <!-- Option B -->
  <g transform="translate(570 165)">
    <text class="mockTitle" x="0" y="-28">Option B - Recommended</text>
    <text class="caption" x="0" y="-6">28 dp section gap, matches the Rally Grid</text>
    <rect x="-8" y="-8" width="376" height="796" rx="48" fill="#E8ECFA" stroke="#4B63C6" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="780" rx="42" fill="#111827" filter="url(#phoneShadow)"/>
    <rect x="13" y="13" width="334" height="754" rx="31" class="canvas"/>
    <rect x="146" y="26" width="70" height="5" rx="3" fill="#22283A" opacity="0.9"/>
    <circle cx="271" cy="32" r="12" fill="#111827"/>
    <text x="34" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#22283A">2:29</text>
    <text class="screenTitle" x="34" y="117">LittlePickle</text>

    <rect x="34" y="155" width="292" height="150" rx="14" class="card"/>
    <g transform="translate(160 188)" stroke="#4B63C6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 15V0h15M45 0h15v15M60 45v15H45M15 60H0V45"/>
      <rect x="22" y="20" width="7" height="7" rx="1"/>
      <rect x="35" y="20" width="7" height="7" rx="1"/>
      <rect x="22" y="34" width="7" height="7" rx="1"/>
      <path d="M36 36h8v8h-8zM31 48h4M47 32h5M15 33h4"/>
    </g>
    <text x="180" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#4B63C6">Scan league QR</text>

    <line x1="34" y1="331" x2="143" y2="331" class="divider"/>
    <text x="180" y="336" text-anchor="middle" class="meta">or</text>
    <line x1="216" y1="331" x2="326" y2="331" class="divider"/>

    <rect x="34" y="358" width="292" height="52" rx="14" class="control"/>
    <g transform="translate(54 374)" stroke="#686D7A" stroke-width="2.25" fill="none" stroke-linecap="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="M13 13l7 7"/>
    </g>
    <text x="82" y="391" class="body" fill="#686D7A">Search for a league</text>

    <line x1="304" y1="410" x2="304" y2="438" class="ruler"/>
    <path d="M298 410h12M298 438h12" class="ruler"/>
    <text x="314" y="428" class="rulerText">28</text>

    <text x="34" y="462" class="sectionTitle">Your leagues</text>
    <rect x="34" y="480" width="292" height="118" rx="16" class="card" filter="url(#cardShadow)"/>
    <text x="51" y="517" class="label">Glennville Pickleball</text>
    <text x="51" y="540" class="label">Association</text>
    <text x="51" y="567" class="meta">2 courts | 30427 | 7 players, 0</text>
    <text x="51" y="588" class="meta">matches</text>
    <text x="254" y="547" class="button" text-anchor="middle">Enter queue</text>

    <text x="82" y="694" class="cta">Looking to start a league?</text>
    <text x="252" y="694" class="ctaButton" text-decoration="underline">Create league</text>
    <rect x="13" y="706" width="334" height="61" fill="#FFFDF8"/>
    <line x1="13" y1="706" x2="347" y2="706" class="divider"/>
    <rect x="75" y="716" width="52" height="44" rx="14" fill="none" stroke="#4B63C6" stroke-width="1.8"/>
    <text x="101" y="744" text-anchor="middle" class="nav" fill="#4B63C6">Home</text>
    <text x="181" y="744" text-anchor="middle" class="nav" fill="#686D7A">Play</text>
    <text x="260" y="744" text-anchor="middle" class="nav" fill="#686D7A">Profile</text>
  </g>

  <!-- Option C -->
  <g transform="translate(1060 165)">
    <text class="mockTitle" x="0" y="-28">Option C - Airy</text>
    <text class="caption" x="0" y="-6">32 dp gap, more editorial breathing room</text>
    <rect x="0" y="0" width="360" height="780" rx="42" fill="#111827" filter="url(#phoneShadow)"/>
    <rect x="13" y="13" width="334" height="754" rx="31" class="canvas"/>
    <rect x="146" y="26" width="70" height="5" rx="3" fill="#22283A" opacity="0.9"/>
    <circle cx="271" cy="32" r="12" fill="#111827"/>
    <text x="34" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#22283A">2:29</text>
    <text class="screenTitle" x="34" y="117">LittlePickle</text>

    <rect x="34" y="155" width="292" height="150" rx="14" class="card"/>
    <g transform="translate(160 188)" stroke="#4B63C6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 15V0h15M45 0h15v15M60 45v15H45M15 60H0V45"/>
      <rect x="22" y="20" width="7" height="7" rx="1"/>
      <rect x="35" y="20" width="7" height="7" rx="1"/>
      <rect x="22" y="34" width="7" height="7" rx="1"/>
      <path d="M36 36h8v8h-8zM31 48h4M47 32h5M15 33h4"/>
    </g>
    <text x="180" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#4B63C6">Scan league QR</text>

    <line x1="34" y1="331" x2="143" y2="331" class="divider"/>
    <text x="180" y="336" text-anchor="middle" class="meta">or</text>
    <line x1="216" y1="331" x2="326" y2="331" class="divider"/>

    <rect x="34" y="358" width="292" height="52" rx="14" class="control"/>
    <g transform="translate(54 374)" stroke="#686D7A" stroke-width="2.25" fill="none" stroke-linecap="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="M13 13l7 7"/>
    </g>
    <text x="82" y="391" class="body" fill="#686D7A">Search for a league</text>

    <line x1="304" y1="410" x2="304" y2="442" class="ruler"/>
    <path d="M298 410h12M298 442h12" class="ruler"/>
    <text x="314" y="430" class="rulerText">32</text>

    <text x="34" y="466" class="sectionTitle">Your leagues</text>
    <rect x="34" y="486" width="292" height="118" rx="16" class="card" filter="url(#cardShadow)"/>
    <text x="51" y="523" class="label">Glennville Pickleball</text>
    <text x="51" y="546" class="label">Association</text>
    <text x="51" y="573" class="meta">2 courts | 30427 | 7 players, 0</text>
    <text x="51" y="594" class="meta">matches</text>
    <text x="254" y="553" class="button" text-anchor="middle">Enter queue</text>

    <text x="82" y="694" class="cta">Looking to start a league?</text>
    <text x="252" y="694" class="ctaButton" text-decoration="underline">Create league</text>
    <rect x="13" y="706" width="334" height="61" fill="#FFFDF8"/>
    <line x1="13" y1="706" x2="347" y2="706" class="divider"/>
    <rect x="75" y="716" width="52" height="44" rx="14" fill="none" stroke="#4B63C6" stroke-width="1.8"/>
    <text x="101" y="744" text-anchor="middle" class="nav" fill="#4B63C6">Home</text>
    <text x="181" y="744" text-anchor="middle" class="nav" fill="#686D7A">Play</text>
    <text x="260" y="744" text-anchor="middle" class="nav" fill="#686D7A">Profile</text>
  </g>

  <rect x="80" y="985" width="1340" height="86" rx="18" fill="#FFFDF8" stroke="#D8D5CD"/>
  <text x="110" y="1018" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#22283A">Recommendation</text>
  <text x="110" y="1044" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#686D7A">Use Option B: keep the search field in the entry group, then add one 28 dp section gap before "Your leagues".</text>
  <text x="110" y="1066" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#686D7A">Keep 12 dp from the heading to the league card. This matches the Rally Grid and preserves the bottom CTA.</text>
</svg>
