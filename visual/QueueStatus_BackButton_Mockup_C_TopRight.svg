    <text x="225" y="414" text-anchor="middle" class="mono metric">3.00</text>
    <line x1="277" y1="368" x2="277" y2="414" stroke="#D8D5CD" stroke-width="1"/>
    <text x="322" y="382" text-anchor="middle" class="secondary">Wait</text>
    <text x="322" y="414" text-anchor="middle" class="mono metric">8 min</text>

    <text x="74" y="482" class="section">Current players</text>
    <rect x="74" y="506" width="302" height="52" rx="14" fill="#FFFDF8" stroke="#D8D5CD"/>
    <circle cx="98" cy="532" r="6" fill="none" stroke="#686D7A" stroke-width="2"/>
    <path d="M103 537l7 7" stroke="#686D7A" stroke-width="2" stroke-linecap="round"/>
