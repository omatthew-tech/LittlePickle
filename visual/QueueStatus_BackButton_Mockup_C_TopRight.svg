  <rect x="47" y="852" width="356" height="84" fill="#FFFDF8" stroke="#D8D5CD"/>
  <g class="ui" text-anchor="middle">
    <rect x="132" y="862" width="52" height="54" rx="16" fill="none" stroke="#4B63C6" stroke-width="1.6"/>
    <path d="M149 887v-14l9-8 9 8v14h-6v-9h-6v9z" fill="none" stroke="#4B63C6" stroke-width="2" stroke-linejoin="round"/>
    <text x="158" y="908" class="nav" fill="#4B63C6">Home</text>
    <path d="M225 873h7v7h-7zM234 879h7v7h-7z" fill="none" stroke="#686D7A" stroke-width="2"/>
    <text x="232" y="908" class="nav">Play</text>
    <circle cx="307" cy="876" r="7" fill="none" stroke="#686D7A" stroke-width="2"/>
    <path d="M295 892c3-8 21-8 24 0" fill="none" stroke="#686D7A" stroke-width="2" stroke-linecap="round"/>
    <text x="307" y="908" class="nav">Profile</text>
