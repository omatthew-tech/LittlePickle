      <rect width="302" height="64" rx="12" fill="#CBDDA4"/>
      <circle cx="30" cy="32" r="18" fill="#E8ECFA"/>
      <text x="30" y="38" text-anchor="middle" fill="#4B63C6" font-size="14">AF</text>
      <text x="62" y="27" class="body">Amanda Finch</text>
      <text x="62" y="50" class="secondary">3.00</text>
      <path d="M212 33l7 7 14-16" stroke="#4B63C6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="265" y="38" text-anchor="middle" class="action">Remove</text>
    </g>
    <g transform="translate(74 650)">
      <rect width="302" height="64" rx="12" fill="#CBDDA4"/>
      <circle cx="30" cy="32" r="18" fill="#E8ECFA"/>
      <text x="30" y="38" text-anchor="middle" fill="#4B63C6" font-size="14">PE</text>
      <text x="62" y="27" class="body">Player E</text>
      <text x="62" y="50" class="secondary">3.00</text>
      <path d="M212 33l7 7 14-16" stroke="#4B63C6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="265" y="38" text-anchor="middle" class="action">Remove</text>
    </g>
    <g transform="translate(74 726)">
      <rect width="302" height="64" rx="12" fill="#CBDDA4"/>
      <circle cx="30" cy="32" r="18" fill="#E8ECFA"/>
      <text x="30" y="38" text-anchor="middle" fill="#4B63C6" font-size="14">RS</text>
      <text x="62" y="27" class="body">Robin Stewart</text>
      <text x="62" y="50" class="secondary">3.00</text>
      <path d="M212 33l7 7 14-16" stroke="#4B63C6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="265" y="38" text-anchor="middle" class="action">Remove</text>
    </g>
