<svg xmlns="http://www.w3.org/2000/svg" width="450" height="980" viewBox="0 0 450 980">
  <defs>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#22283A" flood-opacity="0.22"/>
    </filter>
    <style>
      .ui { font-family: Cabin, "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .mono { font-family: "Go Mono", Consolas, monospace; letter-spacing: 0; }
      .label { fill: #686D7A; font-size: 13px; }
      .title { fill: #22283A; font-size: 31px; font-weight: 700; }
      .section { fill: #22283A; font-size: 20px; font-weight: 600; }
      .body { fill: #22283A; font-size: 16px; }
      .secondary { fill: #686D7A; font-size: 14px; }
      .action { fill: #4B63C6; font-size: 16px; font-weight: 600; }
      .metric { fill: #22283A; font-size: 24px; font-weight: 700; }
      .nav { fill: #686D7A; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="450" height="980" fill="#ECE8DE"/>
  <text x="26" y="34" class="ui" fill="#22283A" font-size="18" font-weight="700">Option C: Top-right Back</text>
  <text x="26" y="58" class="ui label">Clean title edge, but weaker navigation signal.</text>

  <rect x="34" y="72" width="382" height="878" rx="52" fill="#111318" filter="url(#phoneShadow)"/>
  <rect x="47" y="86" width="356" height="850" rx="42" fill="#F6F2E8"/>
  <circle cx="225" cy="112" r="13" fill="#111318"/>
  <circle cx="225" cy="112" r="5" fill="#1E2A36"/>

  <text x="75" y="119" class="ui" fill="#22283A" font-size="13" font-weight="700">2:51</text>
  <rect x="343" y="110" width="20" height="10" rx="3" fill="#111318"/>
  <rect x="365" y="110" width="9" height="10" rx="2" fill="#111318"/>
  <path d="M326 119c4-6 11-6 15 0" stroke="#111318" stroke-width="2" fill="none" stroke-linecap="round"/>

  <g class="ui">
    <g transform="translate(313 146)">
      <rect x="-12" y="-15" width="72" height="44" rx="14" fill="transparent"/>
      <path d="M10 0 0 10l10 10" stroke="#4B63C6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="23" y="16" class="action">Back</text>
    </g>

    <text x="74" y="192" class="title">Glennville Pickleball</text>
    <text x="74" y="230" class="title">Association</text>

    <rect x="74" y="270" width="302" height="160" rx="16" fill="#FFFDF8" stroke="#CBDDA4" stroke-width="1.4"/>
    <circle cx="116" cy="313" r="24" fill="#CBDDA4"/>
    <text x="116" y="320" text-anchor="middle" fill="#22283A" font-size="16">KT</text>
    <text x="150" y="318" class="body">Kenny Tarver</text>
    <text x="329" y="318" text-anchor="middle" class="action" font-size="15">Leave queue</text>
    <line x1="96" y1="354" x2="356" y2="354" stroke="#D8D5CD" stroke-width="1"/>
    <text x="128" y="382" text-anchor="middle" class="secondary">Up after</text>
    <text x="128" y="414" text-anchor="middle" class="mono metric">1 match</text>
    <line x1="188" y1="368" x2="188" y2="414" stroke="#D8D5CD" stroke-width="1"/>
